
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complete Doctor Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-9 col-lg-8">

            <div class="card shadow">

                <!-- Header -->
                <div class="card-header bg-primary text-white text-center">

                    <h3 class="mb-0">
                        Complete Doctor Profile
                    </h3>

                    <small>
                        Enter professional details of the doctor
                    </small>

                </div>


                <div class="card-body p-4">

                    <!-- SUCCESS MESSAGE -->
                    <div th:if="${success}"
                         class="alert alert-success alert-dismissible fade show"
                         role="alert">

                        <strong>Success!</strong>

                        <span th:text="${success}"></span>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>


                    <!-- ERROR MESSAGE -->
                    <div th:if="${error}"
                         class="alert alert-danger alert-dismissible fade show"
                         role="alert">

                        <strong>Error!</strong>

                        <span th:text="${error}"></span>

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>


                    <!-- DOCTOR PROFILE FORM -->
                    <form action="/admin/add-doctor-details"
                          method="post">




                        <!-- Last Name -->






                        <!-- Phone -->


                        <!-- Specialization -->
                        <div class="mb-3">

                            <label for="specialization"
                                   class="form-label">
                                Specialization
                            </label>

                            <select class="form-select"
                                    id="specialization"
                                    name="specialization"
                                    required>

                                <option value="">
                                    Select Specialization
                                </option>

                                <option value="Cardiologist">
                                    Cardiologist
                                </option>

                                <option value="Dermatologist">
                                    Dermatologist
                                </option>

                                <option value="Neurologist">
                                    Neurologist
                                </option>

                                <option value="Orthopedic">
                                    Orthopedic
                                </option>

                                <option value="Pediatrician">
                                    Pediatrician
                                </option>

                                <option value="General Physician">
                                    General Physician
                                </option>

                                <option value="Gynecologist">
                                    Gynecologist
                                </option>

                                <option value="Dentist">
                                    Dentist
                                </option>

                                <option value="ENT Specialist">
                                    ENT Specialist
                                </option>

                                <option value="Ophthalmologist">
                                    Ophthalmologist
                                </option>

                                <option value="Psychiatrist">
                                    Psychiatrist
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Qualification -->
                        <div class="mb-3">

                            <label for="qualification"
                                   class="form-label">
                                Qualification
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="qualification"
                                   name="qualification"
                                   placeholder="e.g. MBBS, MD, MS"
                                   required>

                        </div>


                        <!-- License Number -->
                        <div class="mb-3">

                            <label for="licenseNumber"
                                   class="form-label">
                                Medical License Number
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="licenseNumber"
                                   name="licenseNumber"
                                   placeholder="Enter medical license number"
                                   required>

                        </div>


                        <!-- Experience -->
                        <div class="mb-3">

                            <label for="experience"
                                   class="form-label">
                                Experience (Years)
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="experience"
                                   name="experience"
                                   placeholder="Enter years of experience"
                                   min="0"
                                   required>

                        </div>


                        <!-- Consultation Fee -->
                        <div class="mb-3">

                            <label for="consultationFee"
                                   class="form-label">
                                Consultation Fee
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    ₹
                                </span>

                                <input type="number"
                                       class="form-control"
                                       id="consultationFee"
                                       name="consultationFee"
                                       placeholder="Enter consultation fee"
                                       min="0"
                                       step="0.01"
                                       required>

                            </div>

                        </div>


                        <!-- Joining Date -->
                        <div class="mb-3">

                            <label for="joiningDate"
                                   class="form-label">
                                Joining Date
                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="joiningDate"
                                   name="joiningDate"
                                   required>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex justify-content-between mt-4">

                            <!-- Cancel -->
                            <a href="/admin/dashboard"
                               class="btn btn-secondary">
                                Cancel
                            </a>


                            <!-- Save Doctor Profile -->
                            <button type="submit"
                                    class="btn btn-primary">
                                Save Doctor Profile
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
```
