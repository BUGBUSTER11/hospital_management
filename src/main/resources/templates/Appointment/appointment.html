<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Appointment | CarePlus Hospital</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/appointment.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-heart-pulse-fill me-2"></i>
            CarePlus Hospital
        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/#doctors">
                        Doctors
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/appointment">
                        Appointment
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= APPOINTMENT SECTION ================= -->

<section class="appointment-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="appointment-card shadow">

                    <!-- Header -->

                    <div class="appointment-header text-center">

                        <div class="appointment-icon">
                            <i class="bi bi-calendar2-plus"></i>
                        </div>

                        <h2 class="fw-bold mt-3">
                            Request an Appointment
                        </h2>

                        <p class="text-muted mb-0">
                            Fill in the details below to request
                            an appointment with our doctor.
                        </p>

                    </div>


                    <!-- Form -->

                    <form id="appointmentForm"
                          action="/appointment/request"
                          method="post">

                        <div class="row g-4">

                            <!-- Appointment ID -->

                            <div class="col-md-6">

                                <label for="appointmentId"
                                       class="form-label">
                                    Appointment ID
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        id="appointmentId"
                                        name="appointmentId"
                                        placeholder="Generated by system"
                                        readonly>

                                <div class="form-text">
                                    Appointment ID will be generated automatically.
                                </div>

                            </div>


                            <!-- Email -->

                            <div class="col-md-6">

                                <label for="email_Id"
                                       class="form-label">
                                    Email ID
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                        type="email"
                                        class="form-control"
                                        id="email_Id"
                                        name="email_Id"
                                        placeholder="Enter your email"
                                        required>

                            </div>


                            <!-- Appointment Date -->

                            <div class="col-md-6">

                                <label for="appointmentDate"
                                       class="form-label">
                                    Appointment Date
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                        type="date"
                                        class="form-control"
                                        id="appointmentDate"
                                        name="appointmentDate"
                                        required>

                            </div>


                            <!-- Appointment Time -->

                            <div class="col-md-6">

                                <label for="appointmentTime"
                                       class="form-label">
                                    Appointment Time
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                        type="time"
                                        class="form-control"
                                        id="appointmentTime"
                                        name="appointmentTime"
                                        required>

                            </div>


                            <!-- Doctor -->

                            <div class="col-md-6">

                                <label for="doctor"
                                       class="form-label">
                                    Select Doctor
                                    <span class="text-danger">*</span>
                                </label>

                                <select
                                        class="form-select"
                                        id="doctor"
                                        name="doctor"
                                        required>

                                    <option value="" selected disabled>
                                        Select Doctor
                                    </option>

                                    <option value="doctor1">
                                        Dr. John Smith - Cardiologist
                                    </option>

                                    <option value="doctor2">
                                        Dr. Sarah Williams - Pediatrician
                                    </option>

                                    <option value="doctor3">
                                        Dr. Michael Brown - Orthopedic
                                    </option>

                                </select>

                            </div>


                            <!-- Service -->

                            <div class="col-md-6">

                                <label for="service"
                                       class="form-label">
                                    Service
                                    <span class="text-danger">*</span>
                                </label>

                                <select
                                        class="form-select"
                                        id="service"
                                        name="service"
                                        required>

                                    <option value="" selected disabled>
                                        Select Service
                                    </option>

                                    <option value="consultation">
                                        General Consultation
                                    </option>

                                    <option value="cardiology">
                                        Cardiology
                                    </option>

                                    <option value="orthopedics">
                                        Orthopedics
                                    </option>

                                    <option value="pediatrics">
                                        Pediatrics
                                    </option>

                                    <option value="diagnostic">
                                        Diagnostic Services
                                    </option>

                                </select>

                            </div>


                            <!-- Contact Number -->

                            <div class="col-md-6">

                                <label for="contactNO"
                                       class="form-label">
                                    Contact Number
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                        type="tel"
                                        class="form-control"
                                        id="contactNO"
                                        name="contactNO"
                                        placeholder="Enter contact number"
                                        pattern="[0-9]{10}"
                                        maxlength="10"
                                        required>

                                <div class="form-text">
                                    Enter 10 digit mobile number.
                                </div>

                            </div>


                            <!-- Location -->

                            <div class="col-md-6">

                                <label for="location"
                                       class="form-label">
                                    Location
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        id="location"
                                        name="location"
                                        placeholder="Enter your location"
                                        required>

                            </div>


                            <!-- Reason -->

                            <div class="col-12">

                                <label for="reason"
                                       class="form-label">
                                    Reason for Appointment
                                    <span class="text-danger">*</span>
                                </label>

                                <textarea
                                        class="form-control"
                                        id="reason"
                                        name="reason"
                                        rows="3"
                                        placeholder="Briefly describe the reason for your appointment"
                                        required></textarea>

                            </div>


                            <!-- Notes -->

                            <div class="col-12">

                                <label for="notes"
                                       class="form-label">
                                    Additional Notes
                                </label>

                                <textarea
                                        class="form-control"
                                        id="notes"
                                        name="notes"
                                        rows="3"
                                        placeholder="Enter any additional information"></textarea>

                            </div>


                            <!-- Status -->

                            <div class="col-md-6">

                                <label for="status"
                                       class="form-label">
                                    Status
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        id="status"
                                        name="status"
                                        value="PENDING"
                                        readonly>

                            </div>


                            <!-- Created At -->

                            <div class="col-md-6">

                                <label for="createdAt"
                                       class="form-label">
                                    Created At
                                </label>

                                <input
                                        type="text"
                                        class="form-control"
                                        id="createdAt"
                                        name="createdAt"
                                        placeholder="Generated by system"
                                        readonly>

                            </div>


                            <!-- Buttons -->

                            <div class="col-12">

                                <hr>

                                <div class="d-flex justify-content-center gap-3">

                                    <!-- Request Appointment -->

                                    <button
                                            type="submit"
                                            class="btn btn-primary px-4">

                                        <i class="bi bi-calendar-check me-2"></i>
                                        Request Appointment

                                    </button>


                                    <!-- Clear -->

                                    <button
                                            type="reset"
                                            class="btn btn-outline-secondary px-4">

                                        <i class="bi bi-arrow-counterclockwise me-2"></i>
                                        Clear

                                    </button>

                                </div>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 CarePlus Hospital. All Rights Reserved.
    </p>

</footer>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</body>

</html>
