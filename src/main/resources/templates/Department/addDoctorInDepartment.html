
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Doctor | CarePlus</title>

  <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f7fb;
        padding: 40px;
    }

    .container {
        width: 700px;
        max-width: 100%;
        margin: auto;
    }

    h1 {
        color: #1e293b;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #64748b;
        margin-bottom: 25px;
    }

    .form-card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #334155;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #2563eb;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }
  </style>

</head>

<body>

<div class="container">

  <h1>Add Doctor</h1>

  <p class="subtitle">
    Register a new doctor in the hospital.
  </p>

  <div class="form-card">

    <form>

      <div class="form-group">
        <label>Doctor Name</label>
        <input type="text"
               name="name"
               placeholder="Enter doctor name">
      </div>

      <div class="form-group">
        <label>Qualification</label>

        <select name="qualification">

          <option value="">
            Select Qualification
          </option>

          <option value="MBBS">MBBS</option>
          <option value="MD">MD</option>
          <option value="MS">MS</option>
          <option value="BAMS">BAMS</option>
          <option value="BHMS">BHMS</option>
          <option value="BDS">BDS</option>

        </select>

      </div>

      <div class="form-group">
        <label>Specialization</label>

        <select name="specialization">

          <option value="">
            Select Specialization
          </option>

          <option value="General Medicine">
            General Medicine
          </option>

          <option value="Cardiology">
            Cardiology
          </option>

          <option value="Neurology">
            Neurology
          </option>

          <option value="Neurosurgery">
            Neurosurgery
          </option>

          <option value="Orthopedics">
            Orthopedics
          </option>

          <option value="Dermatology">
            Dermatology
          </option>

        </select>

      </div>

      <div class="form-group">
        <label>Department</label>

        <select name="department">

          <option value="">
            Select Department
          </option>

          <option value="Cardiology">
            Cardiology
          </option>

          <option value="Neurology">
            Neurology
          </option>

          <option value="Orthopedics">
            Orthopedics
          </option>

          <option value="Dermatology">
            Dermatology
          </option>

        </select>

      </div>

      <div class="form-group">
        <label>Email</label>

        <input type="email"
               name="email"
               placeholder="Enter email">
      </div>

      <div class="form-group">
        <label>Phone</label>

        <input type="text"
               name="phone"
               placeholder="Enter phone number">
      </div>

      <button type="submit">
        Add Doctor
      </button>

    </form>

  </div>

</div>

</body>

</html>
