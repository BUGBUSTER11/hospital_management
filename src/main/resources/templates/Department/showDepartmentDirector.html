
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Department Directors | CarePlus</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>Department Directors</h2>
      <p class="text-muted">
        View the director assigned to each department.
      </p>
    </div>

    <a href="/admin/department"
       class="btn btn-secondary">
      Back
    </a>
  </div>


  <div class="card shadow-sm">

    <div class="card-body">

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Department Code</th>
            <th>Department Name</th>
            <th>Director</th>
            <th>Director Email</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="department, stat : ${departments}">

            <td th:text="${stat.count}">
              1
            </td>

            <td>
                            <span class="badge bg-primary"
                                  th:text="${department.departmentCode}">
                                CARD
                            </span>
            </td>

            <td th:text="${department.departmentName}">
              Cardiology
            </td>

            <td th:if="${department.director != null}"
                th:text="${department.director.name}">
              Director Name
            </td>

            <td th:if="${department.director == null}">
                            <span class="text-muted">
                                No Director Assigned
                            </span>
            </td>

            <td th:if="${department.director != null}"
                th:text="${department.director.email}">
              director@example.com
            </td>

            <td th:if="${department.director == null}">
              -
            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(departments)}">

            <td colspan="5"
                class="text-center text-muted py-4">
              No departments found.
            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

</body>
</html>
